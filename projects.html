<div id="panels"><noscript><div class="static-projects"><article id="metricast"><h3>METRICAST</h3><p>An academic restaurant analytics workspace covering POS imports, performance dashboards, customer and product views, operational reports, and sales forecasts.</p><p><strong>Tools &amp; Platforms:</strong> Python, CSV / POS Data Processing.</p><p><strong>Methods &amp; Techniques:</strong> Time-Series Forecasting, Forecast Evaluation, Data Visualization, Database Design.</p><p><strong>Data Sources:</strong> Restaurant POS exports.</p><p>The reference screens show a workflow for importing the three related POS files, checking data relationships, exploring performance views and reviewing actual-versus-forecast charts with error measures.</p><p><a href="https://www.linkedin.com/in/rodge-trione-estepa/" target="_blank" rel="noopener noreferrer">Learn more on LinkedIn</a></p></article><article id="jru-library-assist"><h3>JRU Library Assist</h3><p>A web-based library companion for questions about hours, borrowing, renewals, resources and library policies, with source links attached to supported answers.</p><p><strong>Tools &amp; Platforms:</strong> Python, Groq API, ChromaDB, Sentence Transformers, Flask, LangChain Text Splitters, Jupyter Notebook / Google Colab, HTML / CSS / JavaScript, Vercel, Docker, openpyxl.</p><p><strong>Methods &amp; Techniques:</strong> Retrieval-Augmented Generation, Semantic Search, Natural Language Processing, Text Chunking &amp; Embeddings, Source Citations, Retrieval Evaluation.</p><p><strong>Data Sources:</strong> JRU Library FAQ workbook.</p><p>Python prepares the FAQ workbook, splits its text into passages and embeds them with Sentence Transformers. ChromaDB retrieves the three closest passages; Groq generates an answer with citations. Flask serves the interface and API. Requests without sufficient source support receive a fallback response.</p><p><a href="https://jru-library-assist.vercel.app/" target="_blank" rel="noopener noreferrer">Open application</a></p><p><a href="https://www.linkedin.com/in/rodge-trione-estepa/" target="_blank" rel="noopener noreferrer">Learn more on LinkedIn</a></p></article><article id="faostat-dashboard"><h3>FAOSTAT Dashboard</h3><p>A multi-page agricultural dashboard covering Asian countries and regions, with production, yield, harvested area, livestock, descriptive-statistics and forecasting views.</p><p><strong>Tools &amp; Platforms:</strong> Google Looker Studio / Data Studio.</p><p><strong>Methods &amp; Techniques:</strong> Data Visualization, Descriptive Statistics, Agricultural Data Analysis, Forecasting, Forecast Evaluation.</p><p><strong>Data Sources:</strong> FAO FAOSTAT.</p><p>The dashboard organizes FAOSTAT indicators into filtered charts, maps and summary views. Its forecast pages compare regional and country rice projections with historical observations and holdout error measures.</p><p><a href="https://datastudio.google.com/reporting/c5fa71ea-7072-4c0c-bf98-9d022484a28d" target="_blank" rel="noopener noreferrer">Open dashboard</a></p><p><a href="https://www.linkedin.com/in/rodge-trione-estepa/" target="_blank" rel="noopener noreferrer">Learn more on LinkedIn</a></p></article><article id="asean-dse-2026"><h3>ASEAN Data Science Explorers 2026</h3><p>A team presentation titled “From Education to Employment: A Data Story of Youth Labor Market Trends in the Philippines,” supported by a youth and education dashboard.</p><p><strong>Tools &amp; Platforms:</strong> SAP Analytics Cloud, Canva.</p><p><strong>Methods &amp; Techniques:</strong> Data Visualization, Data Storytelling, Labor Market Analysis.</p><p><strong>Data Sources:</strong> ILOSTAT / YouthSTATS, Philippine Statistics Authority.</p><p>The team organized ILOSTAT indicators and PSA references into dashboard comparisons and a Canva presentation. Selected-year trends and gender comparisons support the descriptive narrative.</p><p><a href="https://www.linkedin.com/in/rodge-trione-estepa/" target="_blank" rel="noopener noreferrer">Learn more on LinkedIn</a></p></article></div><section class="certificate-gallery" aria-labelledby="certificates-nojs-title"><h2 id="certificates-nojs-title">Certifications &amp; Trainings</h2><p>A collection of my learning experiences, completed courses, and professional development activities.</p><ul class="cert-fallback"><li><a href="assets/certificates/business-analytics-excel.jpg" target="_blank" rel="noopener">Business Analytics with Excel — Simplilearn SkillUp, November 1, 2026</a></li><li><a href="assets/certificates/asean-dse-competition-2026.jpg" target="_blank" rel="noopener">ASEAN Data Science Explorers 2026 Competition — participation, November 2026</a></li><li><a href="assets/certificates/data-science-analytics.png" target="_blank" rel="noopener">Data Science &amp; Analytics — HP LIFE / HP Foundation, October 29, 2026</a></li><li><a href="assets/certificates/asean-dse-enablement-2026.jpg" target="_blank" rel="noopener">ASEAN Data Science Explorers 2026 Enablement Session — training participation, July 2026</a></li></ul><p>Enable JavaScript for filters, zoom, and the certificate viewer.</p></section><p class="muted">Professional certifications, internships, and case studies have not been added yet. Enable JavaScript to browse using the category tabs.</p></noscript></div>
